server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/mediflow
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Auth-service via Eureka (Spring Cloud Gateway Server WebMVC property path)
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.hhcc.apigateway: DEBUG
