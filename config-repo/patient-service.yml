server:
  port: ${PATIENT_SERVICE_PORT:8082}

spring:
  application:
    name: patient-service

  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/mediflow_patient}
    username: ${PATIENT_DB_USERNAME:postgres}
    password: ${PATIENT_DB_PASSWORD:PgAdmin@123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:12345678901234hjkouyqwtyeuahdbekw}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always